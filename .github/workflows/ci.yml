name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies (with the hte extra; family tests need econml)
        run: uv sync --all-extras --dev

      - name: ruff
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

      - name: pyright
        run: uv run pyright

      - name: import-linter (core must not import a family)
        run: uv run lint-imports

      - name: pytest
        run: uv run pytest
        env:
          PYTHONWARNINGS: ignore
