[project]
name = "causpec"
version = "0.0.1"
description = "Spec-gated causal analysis: confirmed specs, deterministic estimation, traceable reports."
authors = [{ name = "Han Zhou" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# family 的重依赖走 extra：core 保持轻量，装不装由用户按需要决定。
# 缺失时 registry 给结构化错误 + 安装命令，不是裸的 ImportError。
hte = [
    "econml>=0.15",
    "joblib>=1.3",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
]

[project.scripts]
causpec = "causpec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/causpec"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# data/generators 不是包的一部分（生成器不随 wheel 分发），但测试要验证它，
# 所以在测试时加进路径。
pythonpath = ["packages", "data/generators"]

[tool.pyright]
include = ["packages", "tests", "data/generators"]
extraPaths = ["packages", "data/generators"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.importlinter]
root_packages = ["causpec"]

[[tool.importlinter.contracts]]
name = "core 不导入 family"
type = "forbidden"
source_modules = ["causpec.core"]
forbidden_modules = ["causpec.families"]
