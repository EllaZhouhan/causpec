[project]
name = "causpec"
version = "0.0.1"
description = "Spec-gated causal analysis: confirmed specs, deterministic estimation, traceable reports."
authors = [{ name = "Han Zhou" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
causpec = "causpec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/causpec"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]

[tool.pyright]
include = ["packages", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.importlinter]
root_packages = ["causpec"]

[[tool.importlinter.contracts]]
name = "core 不导入 family"
type = "forbidden"
source_modules = ["causpec.core"]
forbidden_modules = ["causpec.families"]
