[project]
name = "causpec"
version = "0.0.1"
description = "Spec-gated causal analysis: confirmed specs, deterministic estimation, traceable reports."
authors = [{ name = "Han Zhou" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
# A family's heavy dependencies live behind an extra, so core stays light and the user
# installs only what they need. When one is missing the registry raises a structured
# error carrying the install command, not a bare ImportError.
hte = [
    "econml>=0.15",
    "joblib>=1.3",
    # linearmodels is here for the instrument diagnostics a single hand-written first stage
    # cannot give: a heteroskedasticity-robust overidentification test when more than one
    # instrument is declared, and a test of whether the treatment behaves endogenously at
    # all. Shea's partial R-squared is not the reason: with one endogenous treatment it
    # equals the ordinary partial R-squared however many instruments there are.
    "linearmodels>=6.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
]
# dynamic_lag_dml needs no econml: the estimator is written here, and what it uses is
# gradient boosting for the continuation model, a linear model for the two orthogonal
# nuisances, and joblib for the bootstrap. Its own extra so a user who wants the lag
# profile does not install econml to get it.
dynamic = [
    "joblib>=1.3",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[project.scripts]
causpec = "causpec.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pre-commit>=3.8",
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/causpec"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# data/generators is not part of the package (generators do not ship in the wheel),
# but the tests verify it, so it joins the path under test.
pythonpath = ["packages", "data/generators"]

[tool.pyright]
include = ["packages", "tests", "data/generators"]
extraPaths = ["packages", "data/generators"]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.importlinter]
root_packages = ["causpec"]

[[tool.importlinter.contracts]]
name = "core must not import a family"
type = "forbidden"
source_modules = ["causpec.core"]
forbidden_modules = ["causpec.families"]
