repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key

  # ruff runs through the project's own environment rather than a pinned mirror.
  # Two ruff versions formatting the same code disagree and undo each other: a
  # pre-commit ruff at 0.8.6 reformatted what the project's 0.16.8 then rejected in
  # CI, so every commit fought the previous one. One version, one source of truth.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (project environment)
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff-format (project environment)
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

  - repo: local
    hooks:
      - id: no-data-files
        name: block data files from being committed
        entry: python3 scripts/check_no_data_files.py
        language: system
        pass_filenames: true
