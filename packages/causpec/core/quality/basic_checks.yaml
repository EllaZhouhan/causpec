# Thresholds for the basic layer (design.md 8.1). Outside the code for the same reason the
# claim-level rules are: they decide whether an analysis proceeds, so they are fixed in
# advance, printed in the report and reproducible later.
version: 1

basic_column_types:
  layer: basic
  severity: blocking
  waivable: false
  # A column the estimation uses has to be numeric. A column of numbers with one "NA" in it
  # reads as text, and then every value in it is text.

basic_missing_values:
  layer: basic
  severity: blocking
  waivable: false
  # Not waivable and not imputable: the treatment, the outcome and the covariates of a row
  # are the row, so a guess at one of them is a guess at the effect. Left alone this reaches
  # a nuisance regression and surfaces as a bare complaint about NaN.

basic_duplicate_rows:
  layer: basic
  severity: blocking
  waivable: false
  # The row key is the unit, plus the period when the data is a panel. A unit appearing
  # twice is counted twice, which silently reweights the sample towards whoever was
  # duplicated.

basic_null_encoding:
  layer: basic
  severity: blocking
  waivable: true
  # Values that are placeholders rather than measurements. Waivable because only the user
  # knows whether a value is real in their data.
  #
  # The list is deliberately out of band. -1 and 0 are not on it: a negative fluid balance
  # and a urine output of zero are both real, and a check that cries wolf is a check that
  # gets turned off. What is left are values no instrument produces.
  numeric_sentinels: [-99999, -9999, -999, -99, 99, 999, 9999, 99999, -888, 888]
  # A placeholder repeats. One -999 in forty thousand rows is more likely a typo, and the
  # repair for a typo is not the repair for an encoding.
  min_occurrences: 3
  # Text that means "missing" in a column that is otherwise numeric. Matched case-insensitively
  # after stripping whitespace.
  string_nulls:
    ["na", "n/a", "nan", "null", "none", "nil", "missing", "unknown", ".", "-", "?", ""]

basic_zero_spike:
  # A column with at most this many distinct values is a code or a score, not a
  # continuous measurement, and both of these statistics are in units of the column's
  # own spread and assume a continuum. On an AKI stage of 0 to 3 the gap above zero is
  # the scale's granularity and is always about one spread wide.
  #
  # Twenty, because the cut is not delicate: on this project's data the codes and
  # scores have 2, 2, 2, 2, 4 and 18 levels, and the smallest genuine measurement
  # column has 3,226.
  max_levels_for_a_scale: 20
  layer: basic
  severity: warning
  waivable: true
  # Zeros that look like a different population from the rest of the column: a pile of exact
  # zeros sitting well away from where the real values start. In ICU extracts this is how a
  # missing lab often arrives, since zero is what an empty field becomes on export.
  #
  # Only a warning, and only for columns with no negative values. Whether a zero creatinine
  # is impossible is clinical knowledge, so the check reports the shape and asks.
  min_zero_share: 0.01
  # The statistic is the smallest non-zero value, divided by the interquartile range of the
  # non-zero values. It asks whether anything sits just above zero.
  #
  # The obvious statistic does not work. Measuring how far the bulk starts from zero, say the
  # fifth percentile over the standard deviation, gives 0.28 for a creatinine column with 10%
  # of values zeroed on export and 0.27 for a urine output whose 10% zeros are real: the two
  # are indistinguishable, because a column with many real zeros also has its bulk away from
  # zero. What differs is the gap. Creatinine resumes at 30, a fifth of its spread above zero,
  # while urine output has values at 1 and 2 ml: 0.19 against 0.00, measured on the same data.
  min_gap_to_iqr: 0.05

basic_isolated_extremes:
  # A column with at most this many distinct values is a code or a score, not a
  # continuous measurement, and both of these statistics are in units of the column's
  # own spread and assume a continuum. On an AKI stage of 0 to 3 the gap above zero is
  # the scale's granularity and is always about one spread wide.
  #
  # Twenty, because the cut is not delicate: on this project's data the codes and
  # scores have 2, 2, 2, 2, 4 and 18 levels, and the smallest genuine measurement
  # column has 3,226.
  max_levels_for_a_scale: 20
  layer: basic
  severity: warning
  waivable: true
  # A value separated from the rest of its column by a gap, which is what a transcription
  # error looks like: a decimal slipped, or three rows entered in different units.
  #
  # The statistic is the gap between the most extreme value and the next one, in interquartile
  # ranges. A plain z-score rule is useless here: on this project's own ICU data the largest
  # |z| per column runs from 2.9 to 4.2, so a rule at 3 or 4 fires on nearly every column and
  # the check gets ignored. Lab values are right-skewed and a long tail is just a long tail.
  # What a mistake produces is an isolated point. Measured on the same data: clean columns
  # have top gaps of 0.007 to 0.31 IQR, one creatinine multiplied by ten gives 1.47, and three
  # potassiums in the wrong units give 2145.
  #
  # A warning, never blocking: in an ICU a creatinine of 900 is real and clinically important,
  # and a check that encourages deleting it would do more harm than the outlier.
  min_gap_to_iqr: 1.0

basic_impossible_sign:
  layer: basic
  severity: blocking
  waivable: true
  # A handful of values with the opposite sign to everything else in the column. A negative
  # creatinine, a negative length of stay. Waivable because only the user knows their columns.
  #
  # The rule needs the column to be nearly all one sign, so a genuinely signed quantity is
  # left alone: the fluid-balance column in this project's own data is 61% negative and 39%
  # positive and never fires.
  min_dominant_share: 0.99

basic_constant_column:
  layer: basic
  severity: warning
  waivable: true
  # A column with one value carries no information. It is not an error, but a covariate set
  # built by a script often collects a few, and they are worth naming: some learners will
  # also divide by their zero variance.

# ---- the feasibility layer (design.md 8.1) ----
# Cross-sectional analyses only: a panel's equivalent is its per-lag window counts, which the
# family computes because they depend on the lag structure.

feasibility_arm_sizes:
  layer: feasibility
  severity: blocking
  waivable: true
  # Below this an arm cannot support anything, heterogeneity least of all. Deliberately a
  # floor rather than a power calculation: design.md 10.2's rule is that if the confidence
  # interval already says it, do not gate on it, and an arm of 200 against an arm of 3000 is
  # something the interval does say.
  min_per_arm: 20

feasibility_event_counts:
  layer: feasibility
  severity: blocking
  waivable: true
  # Binary outcomes only. This is the case design.md 10.2's rule does *not* cover: with few
  # events a forest still produces confident-looking per-point estimates, so the interval does
  # not say it. On this project's own realistic preset, 415 treated patients at a 3.8% event
  # rate give 25 events, and a seven-covariate CATE over 25 events is fitting noise.
  min_events_per_arm: 10
  # The classic rule for a logistic outcome model is ten events per variable. A forest is less
  # sharp about it, so this warns rather than blocks, and it uses the smaller arm's events
  # because that is the binding constraint. The realistic preset lands at 3.6 and warns, which
  # is the right verdict for it.
  min_events_per_covariate: 5
  # Thin rather than impossible, so this sub-case warns where falling below the per-arm floor
  # refuses. Declared here rather than decided in code, like every other line in this file.
  severity_thin_covariates: warning

# ---- the temporal layer (design.md 8.1) ----
# All of these read optional spec fields: time_zero, treatment_time, outcome_time,
# followup_end, and outcome_horizon for the last one. A study with no timestamps is a
# legitimate thing to analyse, so a missing field makes the check report that it did not run
# rather than pass. Times may be timestamps or numbers; only the horizon needs a unit, and it
# is taken in whatever unit the columns already use.

temporal_time_columns_parse:
  layer: temporal
  severity: blocking
  waivable: false
  # A column that is neither a timestamp nor a number cannot be ordered, so every check
  # below it would skip silently.

temporal_treatment_before_time_zero:
  layer: temporal
  severity: blocking
  waivable: true
  # Immortal time, and the reason this layer exists. Waivable because a handful of rows can
  # be a time-zone artefact the user knows about, while the pattern is a design error.

temporal_outcome_before_treatment:
  layer: temporal
  severity: blocking
  waivable: false
  # An event before the exposure cannot have been caused by it. Not waivable: there is no
  # reading of the data under which these rows belong in the estimate.

temporal_inversion:
  layer: temporal
  severity: blocking
  waivable: false
  # Follow-up ending before it starts, or an outcome dated after it closed.

temporal_insufficient_followup:
  layer: temporal
  severity: blocking
  waivable: true
  # Units with no event and less follow-up than the outcome window asks for. Their outcome is
  # unknown, not negative.
  #
  # The threshold is zero rather than a small share: any unit counted as surviving a window it
  # was not observed through is a wrong row, and the right response is to say how many and
  # decide, not to tolerate a quota. Waivable for the design that handles it deliberately.
  max_short_share: 0.0

# ---------------------------------------------------------------------------------------
# Population. Labelled `identification` rather than given a layer of their own: selecting
# the population on a consequence of treatment is an identification failure, and the layer
# names what a check is about rather than where its code lives, the same way the counting
# half of feasibility lives in core.
# ---------------------------------------------------------------------------------------

population_filter_variable:
  layer: identification
  severity: blocking
  waivable: false
  # Filtering on the treatment or the outcome. Not waivable: there is no reading of the data
  # under which comparing the survivors of one arm with the survivors of the other answers
  # the question that was asked.
  #
  # The separation thresholds are the ones `panel_post_treatment_state` uses, deliberately:
  # it is the same error, reached by selection instead of by adjustment. A confounder is meant
  # to predict the treatment, so a moderate correlation is the design working; near-perfect
  # separation belongs to a column recorded after the decision.
  separation_blocking_above: 0.9
  separation_warning_above: 0.7
  severity_suspicious: warning

population_exclusion_informative:
  layer: identification
  severity: warning
  waivable: true
  # Whether the rows a filter removed differ from the rows it kept, on the treatment rate and
  # the event rate. A warning, never blocking: an informative exclusion is often exactly what
  # the question needs (an eligibility criterion is informative by construction), and the
  # report's exclusion ledger plus this gap is what lets a reader judge it.
  #
  # Ten percentage points is a gap a reader would want to see stated. Below ten the arms and
  # events look alike enough that the ledger's counts carry the story on their own.
  rate_gap_above: 0.1
  # Below this many excluded rows the two rates are too noisy to compare, and a gap computed
  # from four patients would fire more often than one computed from four hundred.
  min_excluded_to_assess: 10

imputation_assumption_declared:
  layer: identification
  severity: blocking
  waivable: true
  # A model-based fill assumes the values are missing at random given what it conditioned on.
  # Nothing can check that, so the assumption goes on the record and the claim level reads it,
  # which is how every other untestable assumption is handled here.
  #
  # Blocking so that the declaration cannot be skipped in silence, waivable so that it never
  # dead-ends: a waiver is itself a statement, and it lowers the claim level on its own.
  #
  # Earlier this was not a check at all: any fill forced `interval_calibration: exploratory`.
  # That was wrong because the alternative, excluding the units with a missing column,
  # distorts the estimate through selection and kept its calibrated interval. Penalising one
  # and not the other is a judgement dressed as arithmetic.

roles_match_adjustment:
  layer: identification
  severity: blocking
  waivable: false
  # Adjusting for a mediator, a collider, a post-treatment variable or the instrument. Not
  # waivable: each distorts the estimate in a direction the interval does not show, because
  # the arithmetic is working correctly on the wrong quantity. There is no reading of the data
  # under which it is the analysis that was asked for.
  #
  # A declared confounder that is not adjusted for is a warning instead: it may be a column
  # this extract does not have, which is a limitation to report rather than an error to
  # refuse. The diagram shows the open path either way.
  severity_unadjusted: warning

family_matches_the_question:
  layer: identification
  severity: warning
  waivable: true
  # Whether the family matches the data's shape and how the treatment was assigned. A warning,
  # not a gate: the gate refuses what cannot run, and this is about whether what ran answers
  # the question, where defensible analyses exist on both sides.
  #
  # It replaces nobody saying anything. A user who said "randomised, but uptake was about 60%"
  # and an analysis routed to hte_backdoor gets an average effect that treats non-compliance
  # as though it never happened, and every other check in the report passes.
