# Rules for deciding how strongly a conclusion may be worded. Mirrors design.md 10.2.
#
# These live in a file rather than in code for the same reason the quality-check
# thresholds do: they decide how strongly a conclusion may be stated, so they must be
# fixed in advance, printed in the report, and recorded in the manifest (which stores
# this file's hash, so the decision can be reproduced later).
version: 1

# The ceiling for an automatic decision. **Code can only downgrade; it cannot grant
# `causal`.** Untestable assumptions (unconfoundedness, exclusion restriction,
# monotonicity) can never be verified by any amount of data, so the most code can
# ever say is "the diagnostics found nothing wrong".
code_maximum: suggestive

rules:
  # The gate failed (spec unconfirmed, or an unwaived blocking quality issue).
  gate_failed: descriptive
  # A blocking check failed, **even if it was waived**. A waiver lets the analysis
  # proceed; it does not make the problem go away, and the diagnosis still has to
  # show up in the wording.
  blocking_check_failed: associational
  # Every blocking check passed.
  all_blocking_checks_passed: suggestive

# All of these must hold to move from suggestive to causal. Any one missing and the
# level stays at suggestive.
causal_requires:
  # Every untestable assumption carries a non-empty justification.
  all_untestable_assumptions_justified: true
  # And that justification came from the user. A model vouching for its own
  # assumptions is circular.
  justification_source: user
  # The user explicitly agreed to causal wording (the causal_claim_approved spec field).
  explicit_user_approval: true
  # An analysis that waived anything cannot reach causal.
  no_waived_blocking_checks: true
  # Every refutation test that ran came back as it should (design.md 10.2 names a failed
  # refutation as disqualifying). The placebo test is the one that matters: an effect that
  # survives permuting the treatment is not an effect of the treatment, and no justification
  # of an assumption repairs that.
  no_failed_refutations: true

# A failed placebo test is worse than a missing justification: it says the pipeline produces
# this number from data that contains no relation at all. So it does not merely withhold
# `causal`, it pulls the level down to `associational`, the same as a failed blocking check,
# because what remains defensible is a statement about association rather than about effect.
failed_refutation_level: associational

# Whether the estimator's intervals may be read as a test. An estimator whose theory
# proves consistency but gives no limiting distribution (dynamic_lag_dml, design.md 7.3)
# produces intervals that indicate where the effect sits and do not test anything. The
# point estimate is the result. Nothing may be called significant, and the level cannot
# reach causal, because "the diagnostics found nothing wrong" says nothing about an
# uncertainty statement the theory does not support.
interval_calibration:
  calibrated:
    significance_claims: allowed
    maximum_level: causal
  exploratory:
    significance_claims: forbidden
    maximum_level: suggestive

# How each level may be phrased, for the skill to follow (design.md 10.2).
wording:
  causal: >-
    may say "reduced" or "increased"; asserts causal direction and magnitude
  suggestive: >-
    may only say "suggests a possible association with ..."; asserts no causation
  associational: >-
    describe the association only, and state that this analysis does not support a
    causal reading
  descriptive: >-
    report each group's numbers only; draw no between-group inference
