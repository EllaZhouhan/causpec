# dynamic_lag_dml: the lag profile of one treatment period on per-period outcomes.
# Mirrors design.md 7.3 (the panel protocol) and 7.6 (estimand reconciliation).
id: dynamic_lag_dml
status: implemented          # planned | implemented
analysis_type: panel
requires_extra: dynamic      # the registry uses this to name the install command

answers: >
  When the treatment is given period by period, what one period of treatment does to
  the outcome of that period and to the outcomes of the periods that follow, on data
  where trajectories end at times that depend on the patient's state and treatment.

# Not a marginal structural model and not a strategy contrast. The unit of exposure is
# one period, and the target is the whole lag profile rather than a single summary.
# "Start early versus start late", the cumulative effect of staying on treatment, and a
# survival endpoint are all different questions; see unsupported_questions below.
identification_strategy: sequential_conditional_mean

# The structural model behind the estimand (Zhou 2026, sections 3 to 4). It is an
# assumption, not a description of the data, and it is untestable: see the assumptions
# block. Written out because every reading of theta depends on it.
structural_model:
  state: X[t+1] = C * A[t] + B * X[t] + eta[t+1]
  outcome: Y[t] = theta_0 * A[t] + mu' * X[t] + epsilon[t+1]
  mean_restrictions: >
    E[eta[t+1] | H[t], A[t], L[t]=1] = 0 and E[epsilon[t+1] | H[t], A[t], L[t]=1] = 0,
    where H[t] is the recorded history before the period-t treatment. The treatment
    mechanism itself is unrestricted: it may depend on the whole history.
  lag_effect: theta_kappa = mu' * B^(kappa-1) * C  for kappa >= 1
  note: >
    theta_kappa is therefore not a free parameter per lag; it is what the state
    propagation implies. With a binary outcome the conditional mean is a probability,
    so every theta_kappa reads as a risk difference for one period of treatment.

estimands:
  - id: lag_profile
    label: Lag profile (theta_0 ... theta_K)
    requires_assumptions:
      - conditionally_independent_continuation
      - continuation_positivity
      - sequential_conditional_mean
      - no_unmeasured_state_confounding
      - lag_relevance
    interpretation: >
      theta_0 is the effect of one period of treatment on the outcome of that same
      period. theta_kappa for kappa >= 1 is the effect of that same period of
      treatment on the outcome kappa periods later. Each is defined on the anchor risk
      set, meaning among trajectories still active at the treatment period, so the
      profile says nothing about patients who had already left. A trajectory that ends
      is not an outcome here: exit truncates the window, and death and discharge are
      treated identically as termination. The report must say this, because "no effect
      at lag 3" reads to a clinician as "no effect on dying", which is not what was
      estimated.

  - id: lag_cate
    label: Lag profile varying with the state (theta_kappa(x))
    requires_assumptions:
      - conditionally_independent_continuation
      - continuation_positivity
      - sequential_conditional_mean
      - no_unmeasured_state_confounding
      - lag_relevance
      - linear_cate_projection
      - modifiers_unaffected_by_treatment
    interpretation: >
      theta_kappa(x) is the lag-kappa effect for a period whose modifiers were x, read at
      the treatment period and not at the outcome period. Structurally this is the
      propagation C varying with x: the same period of treatment moves one patient's
      trajectory further than another's. The projection is linear in the declared
      effect_modifiers, so what is reported is the best linear approximation to
      theta_kappa(x), not an arbitrary function of it.
    note_modifiers_are_baseline: >
      The modifiers have to be variables the treatment does not move, which in practice
      means baseline ones. This is not a preference. If the propagation varies with a state
      the treatment moves, then the effect of the treatment at t on the outcome at t+2 runs
      through two paths, and the second one is multiplied by the treatment at t+1: the
      outcome stops decomposing into a sum of lag effects, and there is no profile left to
      estimate. Fitting one anyway returns numbers that look plausible and are not any
      effect. On the panel generator, before its heterogeneity was moved onto a baseline
      covariate, the constant lag-2 estimate came out at +4.7 where the nominal truth was
      +1.2.
    extends_paper: true
    note: >
      The paper states identification and consistency for the constant profile only.
      The heterogeneous version replaces the scalar moment with a weighted linear
      projection of the same peeled residual moment, which is the natural extension
      and is how the author's earlier panel code did it, but no theorem covers it.
      Its intervals are exploratory for a second reason on top of the one below, and
      claim_levels.yaml caps it accordingly.

# What the question has to look like for this family to be the right one.
requires:
  data_shape: panel
  spec_fields:
    - unit_id            # the patient; the independent unit and the resampling unit
    - period_index       # consecutive integers from 0 within each unit, no gaps
    - period_length      # what one period means in clock time, e.g. 12 hours
    - state              # X, recorded at the START of the period, before that period's treatment
    - treatment          # A, the exposure over the period
    - instant_outcome    # Y, realised after that period's treatment and before the next state
    - max_lag            # K; the profile is theta_0 ... theta_K
    - termination        # what ends a trajectory, and that it is absorbing
    - effect_modifiers   # only for lag_cate; read at the treatment period
  note_period_alignment: >
    The within-period order is fixed and the whole estimand depends on it: active,
    then state, then treatment, then outcome, then the next period. A state column
    measured after the period's treatment began is post-treatment and cannot be in X.
    An outcome recorded before the treatment belongs to the previous period.
  note_consecutive_periods: >
    The lag index counts rows, not clock time. A missing bucket in the middle of a
    trajectory silently turns a lag-2 window into a lag-3 window, so gaps are a
    blocking quality issue rather than something to impute.

assumptions:
  - id: sequential_conditional_mean
    category: untestable
    statement: >
      the additive, time-homogeneous state and outcome equations hold, with the state
      and outcome shocks mean-zero given the recorded history and the current treatment
    note: >
      Stronger than sequential exchangeability alone: it is a functional form as well
      as an independence statement. theta_kappa = mu' B^(kappa-1) C has structural
      meaning only under it. No diagnostic establishes it.

  - id: conditionally_independent_continuation
    category: untestable
    statement: >
      whether a trajectory continues past a period may depend arbitrarily on the
      recorded state and treatment of that period, but not on the outcome or state
      shocks that come later
    note: >
      Sicker patients leaving earlier is allowed and is the reason IPCW is needed.
      What is ruled out is exit driven by something unrecorded that also moves the
      later outcome.

  - id: continuation_positivity
    category: empirically_assessed
    statement: >
      the one-step continuation probability is bounded away from zero on the support of
      the recorded state and treatment
    evidence: >
      the fitted continuation probabilities, the share of them clipped at the floor,
      and the largest IPCW weight at each lag. The weight over a lag-kappa window is a
      product of kappa+1 reciprocals, so a floor of c bounds it by c^-(kappa+1): the
      bound grows geometrically in the lag, which is why the longest lag is where this
      fails first.

  - id: no_unmeasured_state_confounding
    category: untestable
    statement: >
      the recorded state at the start of a period accounts for the reasons that period's
      treatment was given
    note: >
      Confounding by indication within the period. The treatment mechanism may use the
      whole recorded history, but nothing unrecorded may drive both the decision and
      the later outcome.

  - id: lag_relevance
    category: empirically_assessed
    statement: >
      at each lag, the residualised treatment retains enough variation for the moment to
      be informative
    evidence: >
      J_kappa, the IPCW-weighted mean square of the residualised anchor treatment. It
      is the denominator of the estimator, so a small J_kappa is division by almost
      zero, exactly as a weak instrument is in an IV analysis. Blocking.

  - id: modifiers_unaffected_by_treatment
    category: requires_justification
    statement: >
      the variables the lag effect is allowed to vary with are not themselves moved by the
      treatment
    applies_to: [lag_cate]
    evidence: >
      whether each modifier is constant within a unit, and if it is not, whether earlier
      treatment predicts it. A modifier constant within a unit cannot be moved by anything
      that happens during the trajectory, which settles it; a time-varying one has to be
      argued for, because the data cannot separate "the treatment moved it" from "it moved
      and the treatment happened to follow".
    note: >
      Without this the lag profile is not merely heterogeneous, it does not exist: the
      contribution of one treatment period to a later outcome becomes a function of the
      intervening treatment. See the note on lag_cate.

  - id: linear_cate_projection
    category: requires_justification
    statement: >
      the lag-kappa effect is approximately linear in the declared effect modifiers
    applies_to: [lag_cate]
    note: >
      Only the projection is reported, so this is not a claim that the truth is linear.
      It is a claim that a linear summary of it is worth reading, which the user has to
      be willing to defend.

estimator:
  primary: dynamic_lag_dml     # the author's research code, ported; see references
  recipe:
    continuation_model: gradient_boosting
    outcome_and_treatment_nuisances: linear
    cross_fitting: by unit, not by row
    stage1_weighting: ipcw
  note_stage1_weighting: >
    The Stage-1 nuisances are anchor-conditional, so they have to be fitted with the
    IPCW weights. Fitting them unweighted targets the survivor-conditional mean
    instead, which is a different function, and on the author's own design that error
    is worth about +0.20 in the lag-1 and lag-2 effects. It once looked harmless
    because a misspecified continuation model happened to contribute about -0.19 in
    the other direction. Two large errors cancelling is not a correct estimator, and a
    regression test pins the weighting so the cancellation cannot come back.
  note_continuation_model: >
    The moment is Neyman-orthogonal in the outcome and treatment nuisances but NOT in
    the continuation probability, so an error there passes into the estimate at first
    order and is then magnified by the weight product. Gradient boosting is the
    default for that reason: on the author's high-dimensional design a linear logistic
    continuation model leaves a bias that does not shrink with the sample size, while
    the boosted one tracks the oracle. The orthogonal direction is the opposite story,
    where linear nuisances are enough and a boosted one only adds variance.
  note_fixed_horizon: >
    A fixed horizon is detected, not configured. When every unit is observed for the same
    number of periods, no trajectory left early, there is nothing for the weights to
    correct, no continuation model is fitted, and every weight is exactly one; the result
    carries res:profile.horizon = fixed and res:profile.ipcw_applied = False so the report
    can say the weighting was skipped rather than leaving a reader to infer it from weights
    of one. The same rule handles the mixed case: reaching the end of the observation window
    is not leaving, so a trajectory that ends there contributes no record to the continuation
    model, while the ones that ended earlier do. Treating every trajectory's end as an exit
    asks the model to predict "is this the last period", which the state and the treatment
    cannot say; on an eight-period balanced panel that produced fitted continuation
    probabilities as low as 0.40 and weights up to 4.3 in a world where all of them were 1.
  lambda_floor_default: 0.05
  note_lambda_floor: >
    The fitted continuation probabilities are clipped below at a fixed constant before
    inversion. It must be chosen without knowing the true positivity bound, so it is a
    conservative constant, not something read off the data.

inference:
  primary: patient_bootstrap_percentile
  bootstrap:
    n_bootstrap_samples_default: 200
    resampling_unit: unit          # the whole trajectory, refitting every stage
    adequate_threshold: 100
    parallel_param: bootstrap_n_jobs
  secondary: recursive_influence_function
  calibration: exploratory
  note_calibration: >
    The theory proves consistency of the whole profile. It does not give a limiting
    distribution, so neither interval is calibrated and neither may be read as a
    hypothesis test. The bootstrap is the primary one because rows within a trajectory
    are dependent and every lag shares the lower-lag estimates it was peeled with, so
    the trajectory is the only defensible resampling unit. The analytic interval from
    the recursive influence function treats the fitted continuation model as fixed,
    which omits its first-order contribution, and is reported only alongside the
    bootstrap. The report says "exploratory" in both cases and the claim level is
    capped, so the prose cannot call a lag significant.

outputs:
  - the effect at each lag, with its exploratory interval
  - the analysis set at each lag: units, windows, treated share, events
  - the continuation-weight summary at each lag: largest weight, share clipped
  - J at each lag
  - for lag_cate, the projection coefficients and the effect at requested states
  - the profile without IPCW, as a declared sensitivity arm

unsupported_questions:
  - id: strategy_contrast
    example: starting treatment early versus starting it late
    reason: >
      a contrast between two whole strategies over time, which needs the g-formula or
      a marginal structural model. This family estimates what one period of treatment
      does, not what following a rule for many periods does.
  - id: cumulative_effect
    example: the effect of staying on treatment for three days
    reason: >
      the sum of the profile is not that effect: it would need the treatment path to be
      held fixed over the whole window, and the peeling identity does not deliver it.
  - id: survival_endpoint
    example: whether treatment reduces 28-day mortality
    reason: >
      termination is the end of the observation window here, not the outcome. A
      mortality question needs a survival or competing-risks design.
  - id: terminal_outcome
    example: the effect on the SOFA score at discharge
    reason: >
      the outcome is per period. A single outcome measured once at the end of a
      variable-length trajectory is a different estimand.

# Thresholds live here, not in the code: they decide how strongly a conclusion may be
# worded, so they are fixed in advance, printed in the report and hashed into the manifest.
checks:
  panel_period_gaps:
    layer: basic
    severity: blocking
    waivable: false
    # The lag index counts rows. A missing period in the middle of a trajectory turns a
    # lag-2 window into a lag-3 window with no error anywhere, so this cannot be waived
    # and cannot be imputed: the fix is to build the buckets so that every period between
    # the first and the last exists, treated or not.

  panel_duplicate_periods:
    layer: basic
    severity: blocking
    waivable: false
    # Two rows for one unit and period means the state, the treatment or the outcome is
    # ambiguous. Nothing downstream can choose between them.

  panel_too_short_for_the_lag:
    layer: feasibility
    severity: blocking
    waivable: true
    # A lag-K window needs K+2 recorded periods: K+1 from the anchor to the outcome, and
    # one more because observing the outcome of a period means the trajectory reached the
    # next one. Below this many windows the lag is not estimated, it is invented.
    min_windows_per_lag: 100
    min_units_per_lag: 50

  panel_post_treatment_state:
    layer: temporal
    severity: blocking
    waivable: false
    # A state column recorded after the period's treatment began is post-treatment, and
    # adjusting on it blocks the path being estimated. In general the data cannot show
    # this: a state column is *supposed* to predict the same period's treatment, since
    # that is confounding by indication, and correlation alone cannot separate the two.
    # What the data can show is the extreme case, a column that is nearly a copy of the
    # treatment, such as a machine setting recorded during the period. That is blocking.
    # Anything short of it is a warning saying the measurement window has to be confirmed
    # with the user, which is the only way to settle it.
    separation_blocking_above: 0.9
    separation_warning_above: 0.7

  continuation_positivity:
    layer: identification
    severity: blocking
    waivable: true
    # The weight of a lag-kappa window multiplies kappa+1 reciprocals, so a floor of c
    # bounds it by c^-(kappa+1) and the longest lag fails first.
    #
    # The threshold is NOT on the largest weight. These weights are heavy-tailed by
    # construction: on the author's own benchmark, where positivity holds by design and the
    # estimator is consistent, a single lag-2 weight reaches several hundred. Blocking on
    # the maximum would refuse the design the method was proved on.
    #
    # What decides whether a lag is estimated or invented is how many windows effectively
    # carry it, so the threshold is on Kish's effective sample size of the weights. On that
    # same benchmark the lag-2 effective size is about 110 windows at 2,000 units and about
    # 8 at 800, and the estimate is usable in the first case and not in the second.
    min_effective_windows: 50
    # And separately: how often the floor had to bind. A floor that binds is the data
    # saying continuation is near impossible somewhere, which caps the weight and biases
    # the estimate towards the unweighted one.
    max_clipped_share: 0.05

  lag_relevance:
    layer: identification
    severity: blocking
    waivable: true
    # J is the denominator of the estimator, so this is the weak-instrument problem in
    # another costume. The floor is on the IPCW-weighted mean square of the residualised
    # anchor treatment, per unit.
    min_j_statistic: 0.01

  lag_cate_time_varying_modifier:
    layer: identification
    severity: blocking
    waivable: true
    # Only for lag_cate. A modifier the treatment moves destroys the additive lag
    # decomposition, so this blocks rather than warns; it is waivable because an exogenous
    # time-varying modifier (a calendar effect, say) is legitimate and only the user can
    # say so. Constant within every unit is the case that needs no argument.
    max_within_unit_variation_share: 0.0
    flag_lagged_treatment_correlation: 0.2

  lag_set_composition:
    layer: feasibility
    severity: warning
    waivable: true
    # Not a defect, a caveat that has to reach the reader. Longer trajectories contain
    # more sustained treatment, so the treated share rises with the lag: in the author's
    # application from 12.1% at lag 0 to 17.1% at lag 3. A profile whose last lag rests on
    # a different population from its first has to be read that way.
    flag_treated_share_drift: 0.03
