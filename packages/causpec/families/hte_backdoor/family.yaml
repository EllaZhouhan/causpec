# hte_backdoor: heterogeneous treatment effects under backdoor adjustment (baseline).
id: hte_backdoor
analysis_type: hte
requires_extra: hte
status: implemented

answers: >
  How the treatment effect varies with covariates, assuming the adjustment set
  controls observable confounding adequately.

identification_strategy: backdoor_adjustment

estimands:
  - id: ate
    label: Average treatment effect
    requires_assumptions: [unconfoundedness, positivity, consistency]
  - id: att
    label: Average treatment effect on the treated
    requires_assumptions: [unconfoundedness, positivity, consistency]
  - id: cate
    label: Conditional average treatment effect
    requires_assumptions: [unconfoundedness, positivity, consistency]

requires:
  spec_fields: [treatment, outcome, adjustment_set, effect_modifiers, time_zero]

assumptions:
  - id: unconfoundedness
    category: untestable
    statement: >
      given the adjustment set, treatment assignment is independent of the potential
      outcomes
  - id: positivity
    category: empirically_assessed
    statement: >
      at every covariate value the probability of receiving and of not receiving
      treatment is strictly between 0 and 1
  - id: consistency
    category: requires_justification
    statement: >
      the treatment is well defined, with no materially different versions of it

estimator:
  primary: econml.dml.CausalForestDML       # EconML, MIT
  cate_interval_method: blb                 # bootstrap of little bags, within one fit
  ate_interval_method: blb                  # unlike hte_iv, the ATE interval is analytic too
  calibration: econml.validate.DRTester     # EconML, MIT
  note: >
    The final model is the forest itself, so econml can derive a variance and no
    resampling is needed. hte_iv's NonParamDMLIV can only bootstrap, because its final
    model is an arbitrary regressor.

# Quality checks and thresholds. Thresholds live here rather than in code: they decide
# how strongly a conclusion may be worded (design.md 10.2), so they must be fixed in
# advance, printed in the report, and recorded in the manifest. All are conventions,
# not laws.
checks:
  backdoor_treatment_prevalence:
    layer: feasibility
    severity: warning
    waivable: true
    min_rate: 0.01
    min_per_arm: 50

  backdoor_overlap:
    layer: identification
    severity: blocking          # one of the two blocking checks of design.md 10.2
    waivable: true
    # At most max_extreme_fraction of the sample may fall outside [low, high].
    propensity_low: 0.05
    propensity_high: 0.95
    max_extreme_fraction: 0.05
    # Cross-fitting is mandatory: fitting and predicting on the same data pushes the
    # scores towards 0/1, so common support only *appears* to be missing, and good data
    # gets judged bad.
    cv_folds: 5
    # Overlap asks whether there is a region where treatment is near-deterministic. A
    # too-narrow model can miss real separation, and a false negative costs more than a
    # false positive here, because it lets through an analysis that should have been
    # blocked.
    propensity_model: gradient_boosting     # gradient_boosting | logistic

  backdoor_covariate_imbalance:
    layer: identification
    severity: warning           # not blocking: design.md 10.2 explicitly puts adjusted
    waivable: true              # SMD in the "report it, do not gate on it" list
    max_abs_smd: 0.10           # the conventional threshold in the causal-inference literature

  backdoor_extreme_weights:
    layer: feasibility
    severity: warning
    waivable: true
    min_ess_ratio: 0.20         # Kish effective sample size over actual sample size
