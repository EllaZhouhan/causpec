# hte_backdoor: heterogeneous treatment effects under backdoor adjustment (baseline).
id: hte_backdoor
analysis_type: hte
requires_extra: hte
status: implemented

answers: >
  How the treatment effect varies with covariates, assuming the adjustment set
  controls observable confounding adequately.

identification_strategy: backdoor_adjustment

estimands:
  - id: ate
    label: Average treatment effect
    requires_assumptions: [unconfoundedness, positivity, consistency]
  - id: att
    label: Average treatment effect on the treated
    requires_assumptions: [unconfoundedness, positivity, consistency]
  - id: cate
    label: Conditional average treatment effect
    requires_assumptions: [unconfoundedness, positivity, consistency]
    interpretation: >
      A per-patient effect for every row, summarised as a distribution. It says the effect
      varies and names nobody, which is what makes it the wrong default for "who benefits
      more": a cloud of per-patient numbers invites a reader to pick one out. Prefer `gate`,
      which reports the effect for named groups with an interval each.
  - id: gate
    label: Group average treatment effects
    requires_assumptions: [unconfoundedness, positivity, consistency]
    interpretation: >
      The average effect within each group the user declared, with an interval per group. This
      is the answer to "a conditional effect for whom": one row per group, which is something
      someone can act on or dispute, where a per-patient cloud is not. Every group of every
      declared grouping is printed, so a grouping chosen after reading the importance ranking
      cannot be shown without the dull groups beside it. Needs `effect_groups`, which this
      family's own check enforces, because the requirement holds only for this estimand.

requires:
  # What the estimator cannot start without, which gate condition 3 enforces. Only the
  # unconditional ones belong here: `adjustment_set` is optional (W=None is a valid analysis),
  # and `time_zero` is read solely by the temporal checks, which report that they could not
  # run rather than failing. Listing either here refused specs the code runs perfectly well,
  # which is how an overstated declaration shows up.
  spec_fields: [treatment, outcome, effect_modifiers]

assumptions:
  - id: unconfoundedness
    category: untestable
    statement: >
      given the adjustment set, treatment assignment is independent of the potential
      outcomes
  - id: positivity
    category: empirically_assessed
    statement: >
      at every covariate value the probability of receiving and of not receiving
      treatment is strictly between 0 and 1
  - id: consistency
    category: requires_justification
    statement: >
      the treatment is well defined, with no materially different versions of it

estimator:
  primary: econml.dml.CausalForestDML       # EconML, MIT
  cate_interval_method: blb                 # bootstrap of little bags, within one fit
  ate_interval_method: blb                  # unlike hte_iv, the ATE interval is analytic too
  note: >
    The final model is the forest itself, so econml can derive a variance and no
    resampling is needed. hte_iv's NonParamDMLIV can only bootstrap, because its final
    model is an arbitrary regressor.

# Quality checks and thresholds. Thresholds live here rather than in code: they decide
# how strongly a conclusion may be worded (design.md 10.2), so they must be fixed in
# advance, printed in the report, and recorded in the manifest. All are conventions,
# not laws.
checks:
  backdoor_treatment_prevalence:
    layer: feasibility
    severity: warning
    waivable: true
    min_rate: 0.01
    min_per_arm: 50

  backdoor_overlap:
    layer: identification
    severity: blocking          # one of the two blocking checks of design.md 10.2
    waivable: true
    # At most max_extreme_fraction of the sample may fall outside [low, high].
    propensity_low: 0.05
    propensity_high: 0.95
    max_extreme_fraction: 0.05
    # Cross-fitting is mandatory: fitting and predicting on the same data pushes the
    # scores towards 0/1, so common support only *appears* to be missing, and good data
    # gets judged bad.
    cv_folds: 5
    # Overlap asks whether there is a region where treatment is near-deterministic. A
    # too-narrow model can miss real separation, and a false negative costs more than a
    # false positive here, because it lets through an analysis that should have been
    # blocked.
    propensity_model: gradient_boosting     # gradient_boosting | logistic

  backdoor_covariate_imbalance:
    layer: identification
    severity: warning           # not blocking: design.md 10.2 explicitly puts adjusted
    waivable: true              # SMD in the "report it, do not gate on it" list
    max_abs_smd: 0.10           # the conventional threshold in the causal-inference literature

  backdoor_extreme_weights:
    layer: feasibility
    severity: warning
    waivable: true
    min_ess_ratio: 0.20         # Kish effective sample size over actual sample size

  backdoor_effect_groups:
    layer: feasibility
    severity: blocking
    waivable: false
    # The gate estimand with no groups declared. Not waivable: there is nothing to report.
    # Enforced here rather than in requires.spec_fields because the requirement holds only
    # for this one estimand, and a flat list cannot say "required only when".

# What the refutation tests compare, and the interval that sets the scale for "unchanged"
# (design.md 10.1). Declared rather than discovered, because core must not know that this
# family's headline is an average effect while another's is a lag.
sensitivity:
  primary_address: res:primary.ate
  primary_ci_lower: res:primary.ate_ci_lower
  primary_ci_upper: res:primary.ate_ci_upper
  # The E-value needs a risk ratio, which these two form from the arm risks. A continuous
  # outcome has no risk ratio and the report says so rather than inventing one.
  control_risk_address: res:sample.outcome_rate_control

# Tables core renders from the address map, declared here because core must not know what a
# covariate or a group is. The order is the order of the staged answer: the average effect in
# the primary results, then where the effect varies, then the effect by group.
report_tables:
  - id: effect_importance
    title: Where the effect varies
    rows:
      variable: rank
      from: 0
      through_address: res:importance.last_rank
    columns:
      - {header: Covariate, address: "res:importance.rank{rank}.variable"}
      - {header: Importance, address: "res:importance.rank{rank}.importance", format: ".3f"}
    note: >
      How often the forest split on each covariate to separate treatment effects. This is a
      shortlist for choosing which groups to report, not a ranking of how strongly each
      covariate modifies the effect: it counts splits, so it favours continuous and
      high-cardinality columns over binary ones whatever their true importance, and a column
      correlated with a real modifier inherits some of its rank.

  - id: group_effects
    title: The effect by group
    rows:
      variable: row
      from: 0
      through_address: res:gate.last_row
    columns:
      - {header: Variable, address: "res:gate.row{row}.variable"}
      - {header: Group, address: "res:gate.row{row}.label"}
      - {header: Patients, address: "res:gate.row{row}.n", format: ",d"}
      - {header: Effect, address: "res:gate.row{row}.effect", format: "+.4f"}
      - {header: 95% lower, address: "res:gate.row{row}.ci_lower", format: "+.4f"}
      - {header: 95% upper, address: "res:gate.row{row}.ci_upper", format: "+.4f"}
    note: >
      The average effect within each declared group. Every group is listed, including the dull
      ones: that is what makes a grouping chosen after reading the importance ranking safe to
      report, since the striking group cannot appear on its own. Group intervals are wide, and
      a group whose interval spans the average effect is one this data cannot distinguish from
      the average. Where a grouping was chosen after seeing the ranking, its interval is a
      little optimistic, because the dimension with the most visible variation was the one
      picked.
