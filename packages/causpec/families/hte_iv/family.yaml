# hte_iv: heterogeneous treatment effects under an instrumental-variable design.
# Mirrors design.md 7.6 (estimand / family reconciliation).
id: hte_iv
status: implemented          # planned | implemented
analysis_type: hte
requires_extra: hte          # the registry uses this to name the install command

answers: >
  How the treatment effect varies with covariates when unmeasured confounding is
  present but a credible instrument is available.

identification_strategy: instrumental_variable

# Two backends, selected via spec.estimation.params.estimator. They target the same
# estimand but construct intervals differently, which the report has to state
# (design.md 10.2).
estimators:
  ivforest:                                 # default
    class: econml.grf.CausalIVForest        # EconML, MIT
    cate_interval_method: grf_honest        # Athey-Tibshirani-Wager, within one fit
    ate_interval_method: forest_bootstrap   # see note
    supports_adjustment_set: false          # no separate W channel; adjusts on X only
    supports_multiple_instruments: false
    note: >
      econml.grf exposes pointwise variance only (the covariance matrix from
      predict_and_var is across output dimensions at a single x, not across different
      x). It offers nothing for the variance of an average across the sample, and the
      per-point estimates from one forest are highly correlated, so averaging
      pointwise variances and dividing by n would assume independence. The ATE
      interval therefore comes from a unit-level bootstrap: resample, refit the
      forest, predict on the original X, average, take percentiles. The forest is
      cheap enough for this, measured at about 5 seconds per replicate against about
      26 seconds for dmliv.
  dmliv:
    class: econml.iv.dml.NonParamDMLIV      # EconML, MIT
    model_final: sklearn RandomForestRegressor
    cate_interval_method: bootstrap
    ate_interval_method: bootstrap
    supports_adjustment_set: true
    supports_multiple_instruments: true
    note: >
      Matches the final version of the research code. EconML offers only bootstrap for
      this class (_get_inference_options() lists nothing else) because the final model
      is an arbitrary regressor, from which no variance can be derived.

# Shared by both backends; both are overridable from spec.estimation.params.
bootstrap:
  n_bootstrap_samples_default: 200
  adequate_threshold: 100     # below this, res:estimation.bootstrap_adequate is flagged
  parallel_param: bootstrap_n_jobs

calibration: null    # TODO: an IV-appropriate DR score, written by hand (design.md section 9)

# Both binary and continuous instruments are supported; the identified estimand
# differs, hence the two entries below. The adapter infers discrete_instrument from
# the data and records it in res:instrument.kind.
instrument_kinds: [binary, continuous]

estimands:
  - id: conditional_late
    label: Conditional LATE (compliers only)
    instrument_kind: binary
    requires_assumptions: [relevance, exclusion_restriction, monotonicity]
    interpretation: >
      Holds for compliers only, the people whose treatment status changed because the
      instrument took a different value. Compliers cannot be identified individually,
      so this estimand is neither "the effect for this patient" nor the population
      CATE. The report must say so.

  - id: weighted_conditional_late
    label: Weighted average of marginal LATEs (continuous instrument)
    instrument_kind: continuous
    requires_assumptions: [relevance, exclusion_restriction, uniformity]
    interpretation: >
      With a continuous instrument there is no single complier group. Under uniformity
      (the extension of monotonicity to continuous instruments), what is identified is
      a weighted average of "marginal LATEs" between adjacent instrument values, with
      weights set jointly by the local first-stage slope and the instrument's
      distribution (Angrist & Imbens 1995, JASA). The weights are not chosen by the
      user and do not correspond to population shares, so the population this estimand
      applies to is harder to describe than in the binary case; the report must give
      the weight distribution.

  # TODO(design.md 7.6): only under the further assumption that the effect does not
  # vary by compliance type given covariates can either of the above be read as a
  # population CATE. Whether to adopt that assumption, and how to argue for it, is for
  # the author to fill in.
  # - id: cate
  #   label: Conditional average treatment effect (whole population)
  #   requires_assumptions: [..., no_effect_heterogeneity_by_compliance]

requires:
  spec_fields:
    - treatment            # T, binary
    - outcome              # Y, binary
    - instrument           # Z, one or more columns
    - effect_modifiers     # X, the covariates the CATE varies over
    - adjustment_set       # W, nuisance-only covariates that do not enter the CATE
    - time_zero
  key_non_edges:
    - the instrument affects the outcome only through the treatment   # exclusion restriction
    - the instrument is independent of unmeasured confounders

  # effect_modifiers and adjustment_set are confirmed separately and never merged.
  # The research code defined `controls` (75 columns) and `features` (60 columns) but
  # passed only `features` as X with W=None, silently dropping the difference;
  # separating them at the spec level is what prevents a repeat.
  note_x_vs_w: >
    X determines how the effect varies; W only removes confounding. Putting a variable
    in the wrong place raises no error, it quietly changes the estimand, because a
    variable in X is treated as an effect modifier and one in W is not.

assumptions:
  - id: relevance
    category: empirically_assessed
    statement: the instrument is associated with treatment, strongly enough
  - id: exclusion_restriction
    category: untestable
    statement: the instrument affects the outcome only through the treatment
  - id: monotonicity
    category: untestable
    statement: there are no defiers (binary instrument)
  - id: uniformity
    category: untestable
    statement: >
      the direction of the first-stage response to the instrument is the same for every
      unit (continuous instrument)

# Quality checks and thresholds. Thresholds live here rather than in code: they decide
# how strongly a conclusion may be worded (design.md 10.2), so they must be fixed in
# advance, printed in the report, and recorded in the manifest. Every number below is a
# convention, not a law, and may reasonably be disputed, what matters is that it is
# visible, configurable and reproducible.
checks:
  iv_zero_variation:
    layer: identification
    severity: blocking
    waivable: false
    min_unique_values: 2
    min_std: 1.0e-8

  iv_weak_first_stage:
    layer: identification
    severity: blocking          # one of the two blocking checks of design.md 10.2
    waivable: true
    # Robust F from a linear first stage. The Staiger-Stock rule of thumb is F > 10:
    # widely used, but a rule of thumb. The treatment is binary, so a probit first-stage
    # LR test and McFadden increment are reported alongside, design.md 8.2: the form of
    # the diagnostic is the family's business, not a universal first-stage F.
    min_robust_f: 10.0
    max_lr_p_value: 0.05

  iv_low_complier_share:
    layer: feasibility
    severity: warning           # not blocking: few compliers does not make the estimate
    waivable: true              # wrong, only narrow
    # Binary instruments only. Under monotonicity E[T|Z=1] - E[T|Z=0] is the complier share.
    min_complier_share: 0.05

  iv_covariate_imbalance:
    layer: identification
    severity: warning           # not blocking: the exclusion restriction is untestable,
    waivable: true              # so imbalance is a bad sign, not sufficient evidence
    # Regress each covariate on the instrument, take the p-value, then apply a
    # Benjamini-Hochberg FDR correction. Without the correction, roughly 3 of 60
    # covariates will be "significant" at 0.05 by chance alone.
    fdr_level: 0.10
    max_imbalanced_fraction: 0.10

diagnostics:
  instrument_relevance:
    - first_stage_probit_lr_test
    - first_stage_pseudo_r2
    - first_stage_f_robust
    - partial_r2_iv
  exogeneity:
    - covariate_balance_by_instrument     # p-value per covariate regressed on the instrument
