# hte_iv: heterogeneous treatment effects under an instrumental-variable design.
# Mirrors design.md 7.6 (estimand / family reconciliation).
id: hte_iv
status: implemented          # planned | implemented
analysis_type: hte
requires_extra: hte          # the registry uses this to name the install command

answers: >
  How the treatment effect varies with covariates when unmeasured confounding is
  present but a credible instrument is available.

identification_strategy: instrumental_variable

# Two backends, selected via spec.estimation.params.estimator. They target the same
# estimand but construct intervals differently, which the report has to state
# (design.md 10.2).
estimators:
  ivforest:                                 # default
    class: econml.grf.CausalIVForest        # EconML, MIT
    cate_interval_method: grf_honest        # Athey-Tibshirani-Wager, within one fit
    ate_interval_method: forest_bootstrap   # see note
    supports_adjustment_set: false          # no separate W channel; adjusts on X only
    supports_multiple_instruments: false
    note: >
      econml.grf exposes pointwise variance only (the covariance matrix from
      predict_and_var is across output dimensions at a single x, not across different
      x). It offers nothing for the variance of an average across the sample, and the
      per-point estimates from one forest are highly correlated, so averaging
      pointwise variances and dividing by n would assume independence. The ATE
      interval therefore comes from a unit-level bootstrap: resample, refit the
      forest, predict on the original X, average, take percentiles. The forest is
      cheap enough for this, measured at about 5 seconds per replicate against about
      26 seconds for dmliv.
  dmliv:
    class: econml.iv.dml.NonParamDMLIV      # EconML, MIT
    model_final: sklearn RandomForestRegressor
    cate_interval_method: bootstrap
    ate_interval_method: bootstrap
    supports_adjustment_set: true
    supports_multiple_instruments: true
    note: >
      Matches the final version of the research code. EconML offers only bootstrap for
      this class (_get_inference_options() lists nothing else) because the final model
      is an arbitrary regressor, from which no variance can be derived.

# Shared by both backends; both are overridable from spec.estimation.params.
bootstrap:
  n_bootstrap_samples_default: 200
  adequate_threshold: 100     # below this, res:estimation.bootstrap_adequate is flagged
  parallel_param: bootstrap_n_jobs


# Both binary and continuous instruments are supported; the identified estimand
# differs, hence the two entries below. The adapter infers discrete_instrument from
# the data and records it in res:instrument.kind.
instrument_kinds: [binary, continuous]

estimands:
  - id: conditional_late
    label: Conditional LATE (compliers only)
    instrument_kind: binary
    requires_assumptions: [relevance, exclusion_restriction, monotonicity]
    interpretation: >
      Holds for compliers only, the people whose treatment status changed because the
      instrument took a different value. Compliers cannot be identified individually,
      so this estimand is neither "the effect for this patient" nor the population
      CATE. The report must say so.

  - id: weighted_conditional_late
    label: Weighted average of marginal LATEs (continuous instrument)
    instrument_kind: continuous
    requires_assumptions: [relevance, exclusion_restriction, uniformity]
    interpretation: >
      With a continuous instrument there is no single complier group. Under uniformity
      (the extension of monotonicity to continuous instruments), what is identified is
      a weighted average of "marginal LATEs" between adjacent instrument values, with
      weights set jointly by the local first-stage slope and the instrument's
      distribution (Angrist & Imbens 1995, JASA). The weights are not chosen by the
      user and do not correspond to population shares, so the population this estimand
      applies to is harder to describe than in the binary case; the report must give
      the weight distribution.

  # A population CATE is deliberately **not** offered here, and the reason is the whole of
  # what this family can and cannot say.
  #
  # Reading either estimand above as an effect for the whole population needs one more
  # assumption: that the effect does not vary by compliance type given the covariates. It is
  # untestable in the strongest sense, worse than unconfoundedness, because compliance type is
  # not observed for anyone. A patient's type is defined by what they would have done under
  # both values of the instrument, and only one of those happened, so no diagnostic can
  # compare compliers with never-takers on anything the assumption is about.
  #
  # It is also usually false in the direction that matters. In the ICU application the
  # instrument is bed availability, and compliers are the patients whose dialysis decision a
  # free bed could swing: borderline cases. Always-takers are the patients so sick that
  # dialysis happened regardless, never-takers the ones so stable that it did not. If the
  # effect of dialysis is largest in the borderline group, which is the premise of asking the
  # question at all, then the complier effect is exactly the quantity that does not generalise.
  #
  # So the decision is to refuse rather than to offer it with a caveat. A caveat in a report is
  # read once and the number is carried away; an estimand that does not exist cannot be
  # requested. A user who wants a population effect is routed to hte_backdoor, which needs
  # unconfoundedness instead, and that is a trade to be made in the open rather than inside a
  # sentence about compliance types. unsupported_questions carries this refusal in the words a
  # user would ask it in.

requires:
  # Unconditional requirements only, enforced by gate condition 3. `adjustment_set` is
  # optional (W=None is a valid analysis) and `time_zero` is read only by the temporal
  # checks, which say when they could not run.
  spec_fields:
    - treatment            # T, binary
    - outcome              # Y, binary
    - instrument           # Z, one or more columns
    - effect_modifiers     # X, the covariates the CATE varies over
  key_non_edges:
    - the instrument affects the outcome only through the treatment   # exclusion restriction
    - the instrument is independent of unmeasured confounders

  # effect_modifiers and adjustment_set are confirmed separately and never merged.
  # The research code defined `controls` (75 columns) and `features` (60 columns) but
  # passed only `features` as X with W=None, silently dropping the difference;
  # separating them at the spec level is what prevents a repeat.
  note_x_vs_w: >
    X determines how the effect varies; W only removes confounding. Putting a variable
    in the wrong place raises no error, it quietly changes the estimand, because a
    variable in X is treated as an effect modifier and one in W is not.

assumptions:
  - id: relevance
    category: empirically_assessed
    statement: the instrument is associated with treatment, strongly enough
  - id: exclusion_restriction
    category: untestable
    statement: the instrument affects the outcome only through the treatment
  - id: monotonicity
    category: untestable
    statement: there are no defiers (binary instrument)
  - id: uniformity
    category: untestable
    statement: >
      the direction of the first-stage response to the instrument is the same for every
      unit (continuous instrument)

# Quality checks and thresholds. Thresholds live here rather than in code: they decide
# how strongly a conclusion may be worded (design.md 10.2), so they must be fixed in
# advance, printed in the report, and recorded in the manifest. Every number below is a
# convention, not a law, and may reasonably be disputed, what matters is that it is
# visible, configurable and reproducible.
checks:
  iv_backend_supports_spec:
    layer: feasibility
    severity: blocking
    waivable: false
    # Whether the chosen backend can run the spec as written. ivforest has no W channel and
    # takes one instrument; dmliv has both. Not waivable: nothing would be estimated, so
    # there is nothing to proceed with. It lives here rather than as the estimator's
    # ValueError because it is readable from the spec, and a stack trace after every check
    # has run is a worse way to learn it.

  iv_zero_variation:
    layer: identification
    severity: blocking
    waivable: false
    min_unique_values: 2
    min_std: 1.0e-8

  iv_weak_first_stage:
    layer: identification
    severity: blocking          # one of the two blocking checks of design.md 10.2
    waivable: true
    # Robust F from a linear first stage. The Staiger-Stock rule of thumb is F > 10:
    # widely used, but a rule of thumb. The treatment is binary, so a probit first-stage
    # LR test and McFadden increment are reported alongside, design.md 8.2: the form of
    # the diagnostic is the family's business, not a universal first-stage F.
    min_robust_f: 10.0
    max_lr_p_value: 0.05

  iv_low_complier_share:
    layer: feasibility
    severity: warning           # not blocking: few compliers does not make the estimate
    waivable: true              # wrong, only narrow
    # Binary instruments only. Under monotonicity E[T|Z=1] - E[T|Z=0] is the complier share.
    min_complier_share: 0.05

  iv_overidentification:
    layer: identification
    severity: warning           # never blocking: see below
    waivable: true
    # Only engages with more than one instrument, since with one there is nothing for the
    # instruments to disagree about. Heteroskedasticity-robust, from linearmodels (NCSA),
    # which is the only statistic in this family taken from a package: a hand-rolled version
    # used k degrees of freedom where the test has k-1, and agreed with the package's verdict
    # on every design it was tried on (ADR-0004). A single-instrument analysis never reaches
    # this code, so it never loads linearmodels.
    #
    # Not blocking, and the reason is specific to this family rather than general caution.
    # With a heterogeneous effect, two valid instruments identify two different weighted
    # averages of individual effects, so the test rejects even when every instrument is valid.
    # Measured on this project's own generator: a valid pair that splits the same physician
    # preference two ways gives p = 0.06, while a pair whose second instrument violates
    # exclusion gives p = 0 and a twelvefold change in the estimate. Both readings are live,
    # they call for opposite responses, and only the user can tell them apart.
    min_p_value: 0.05

  iv_treatment_exogeneity:
    layer: identification
    severity: warning
    waivable: true
    # Fires when the test *fails* to reject: the data cannot distinguish the treatment from an
    # exogenous one, so the instrument's variance cost may be buying nothing. Written here
    # with statsmodels rather than imported, because it is three lines of OLS and agrees with
    # the package to under 1% (ADR-0004). Failing to
    # reject is not evidence of exogeneity, and the user's judgement about unmeasured
    # confounding stands above this test, which is why it warns and cannot block.
    max_p_value: 0.10

  iv_covariate_imbalance:
    layer: identification
    severity: warning           # not blocking: the exclusion restriction is untestable,
    waivable: true              # so imbalance is a bad sign, not sufficient evidence
    # Regress each covariate on the instrument, take the p-value, then apply a
    # Benjamini-Hochberg FDR correction. Without the correction, roughly 3 of 60
    # covariates will be "significant" at 0.05 by chance alone.
    fdr_level: 0.10
    max_imbalanced_fraction: 0.10

diagnostics:
  instrument_relevance:
    - first_stage_probit_lr_test
    - first_stage_pseudo_r2
    - first_stage_f_robust
    - partial_r2_iv
  exogeneity:
    - covariate_balance_by_instrument     # p-value per covariate regressed on the instrument

# As for hte_backdoor. The compared number is the local effect among compliers, which is
# what this family estimates; a placebo instrument has to move it to nothing just the same.
sensitivity:
  primary_address: res:primary.ate
  primary_ci_lower: res:primary.ate_ci_lower
  primary_ci_upper: res:primary.ate_ci_upper
  control_risk_address: res:sample.outcome_rate_control
  # **The placebo permutes the outcome here, not the treatment.** An IV estimate is a ratio
  # whose denominator is the instrument-treatment association, so permuting the treatment
  # sends that denominator to zero and the estimate to whatever a near-zero divisor gives:
  # measured on this project's own example it returned +8.66 on a probability scale, the test
  # failed, and every IV analysis was being driven to `associational` by the test rather than
  # by the data. Permuting the outcome leaves the first stage intact and removes the only
  # thing the estimand can come from, which is what the collapse-to-zero standard assumes.
  placebo_column: outcome
  # What the refuted runs may be given instead of the real run's parameters. Each refutation
  # compares a point estimate against the real run's estimate and its interval half-width,
  # so a refuted run's own interval is never read, and on this backend that interval is a
  # bootstrap: seven refits at two hundred replicates each took forty minutes and nothing
  # looked at the result. Five keeps the percentile machinery exercised rather than bypassed.
  refutation_params:
    n_bootstrap_samples: 5

# Questions this family cannot answer, in the words a user would ask them in, so the agent
# refuses with a reason instead of estimating the nearest available thing.
unsupported_questions:
  - id: population_effect
    example: what is the average effect of dialysis across all these patients
    reason: >
      this family identifies the effect among compliers, the patients whose treatment changed
      because the instrument changed. Reading it as a population effect needs the assumption
      that the effect does not vary by compliance type given the covariates, which is
      untestable in the strongest sense: compliance type is never observed for anyone, since
      it is defined by what a patient would have done under both values of the instrument and
      only one of those happened. Route to hte_backdoor, which needs unconfoundedness
      instead. That is a trade to make in the open.
  - id: effect_for_this_patient
    example: would this patient benefit from dialysis
    reason: >
      compliers cannot be identified individually, so no row in the data can be labelled as
      one. The estimate is an average over a subgroup whose membership is unknown, which is
      why it is neither a per-patient effect nor a population CATE.
  - id: who_benefits_most
    example: which kinds of patient benefit most from dialysis
    reason: >
      the effect may vary over covariates among compliers, and hte_backdoor's `gate` estimand
      is the one that reports named groups with an interval each. Under IV the same breakdown
      describes compliers only, and since who is a complier varies with the covariates being
      split on, the groups are not comparable in the way a reader will assume.
