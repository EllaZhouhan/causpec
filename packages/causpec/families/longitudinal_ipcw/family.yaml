# longitudinal_ipcw: longitudinal treatment effects via IPCW.
id: longitudinal_ipcw
status: planned
analysis_type: longitudinal
requires_extra: hte

answers: >
  The effect of a treatment strategy at each lag, on longitudinal data with
  informative censoring and time-varying confounding.

identification_strategy: backdoor_adjustment   # time-varying: sequential exchangeability

estimands:
  - id: lag_effect
    label: Treatment effect at each lag
    # TODO(design.md 7.3): state how each event (outcome / competing / censoring /
    # terminal) is handled, and how the estimand should be read.
    # references/longitudinal-ipcw.md comes first; code follows it.
    requires_assumptions: [sequential_exchangeability, positivity, correct_censoring_model]

requires:
  # The field layout follows the seven components of a target trial (StatsPAI's
  # TargetTrialProtocol, MIT, structure only, no dependency).
  spec_fields:
    - eligibility
    - treatment_strategies
    - assignment
    - follow_up          # time zero and end of follow-up
    - outcome
    - causal_contrast
    - analysis_plan
    - event_roles        # death / discharge / transfer -> outcome | competing | censoring | terminal

assumptions:
  - id: sequential_exchangeability
    category: untestable
    statement: >
      at each time point, given history, treatment assignment is independent of the
      subsequent potential outcomes
  - id: positivity
    category: empirically_assessed
    statement: >
      at each time point and each history, every treatment strategy has positive
      probability
  - id: correct_censoring_model
    category: empirically_assessed
    statement: the censoring model is correctly specified and the weights are not extreme

estimator:
  primary: IPCW          # author's research code; migrated in Phase 4
  # StatsPAI's ipcw is marked analytical-only in its own repository, so it is usable
  # only for cross-checking on synthetic data, not as a reference implementation.

outputs:
  - effect at each lag
  - number at risk
  - weight distribution and ESS
  - sensitivity to clipping
